<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>飞Q · 临时传输</title>
  <link rel="stylesheet" href="/guest.css">
  <script src="/qrcodegen.js" defer></script>
  <script src="/guest.js" defer></script>
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand-wrap">
        <span class="logo" aria-hidden="true">FQ</span>
        <div class="brand-text">
          <div class="title-row">
            <h1>临时传输</h1>
            <span class="mode-badge">局域网直传</span>
          </div>
          <p>飞Q · 免安装扫码直传</p>
        </div>
      </div>
      <button id="qr-toggle" class="tool-btn" type="button" aria-expanded="false">
        <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><path d="M14 14h3v3h-3zM19 14h2v2M14 19h2v2M18 19h3v2"/></svg>
        <span>二维码</span>
      </button>
    </header>

    <div class="status-card">
      <div class="notice">
        <span class="dot" aria-hidden="true"></span>
        <span id="session">正在连接…</span>
      </div>
      <p class="security">
        <svg class="inline-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
        <span>HTTP 局域网明文 · 仅传非敏感内容</span>
      </p>
    </div>

    <section id="qr-panel" class="qr-card" hidden>
      <div class="qr-frame">
        <canvas id="qr" aria-label="临时传输链接二维码"></canvas>
      </div>
      <p class="qr-tip">扫码打开临时传输页</p>
      <div class="qr-actions">
        <code id="qr-link" class="qr-link"></code>
        <button id="copy" class="primary" type="button">复制链接</button>
      </div>
    </section>

    <section class="panel-card" aria-labelledby="files-title">
      <div class="section-title">
        <div class="section-heading">
          <h2 id="files-title">对方分享的文件</h2>
        </div>
        <div class="section-actions">
          <span id="count" class="count-pill">读取中…</span>
          <a id="download-all" class="download" hidden>下载全部</a>
        </div>
      </div>
      <p id="archive-hint" class="archive-hint" hidden>打包下载最多 1000 个文件、单包小于 4 GiB；较大内容请分目录或逐件下载。</p>
      <div id="download-filter" class="download-filter" hidden>
        <label for="download-search">搜索分享文件</label>
        <input id="download-search" type="search" placeholder="按文件名或相对路径搜索" autocomplete="off">
      </div>
      <div id="directory-downloads" class="directories" aria-label="可下载的文件夹" hidden></div>
      <div id="downloads" class="files">
        <p class="empty">正在读取文件…</p>
      </div>
    </section>

    <section id="upload" class="panel-card" hidden aria-labelledby="upload-title">
      <div class="section-title">
        <div class="section-heading">
          <h2 id="upload-title">发送给对方</h2>
        </div>
        <span id="upload-quota" class="quota-pill">正在读取接收上限</span>
      </div>
      <div class="upload-body">
        <label id="drop" tabindex="0">
          <span class="upload-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          </span>
          <strong>选择文件或拖放到这里</strong>
          <span>分块上传 · 中断可续传</span>
          <input id="picker" type="file" multiple hidden>
        </label>
        <button id="choose-folder" class="soft" type="button" hidden>选择文件夹（保留目录）</button>
        <input id="folder-picker" type="file" webkitdirectory multiple hidden>
        <div id="upload-summary" class="upload-summary" hidden aria-live="polite">
          <div class="summary-values">
            <span id="upload-bytes">已传字节：0 B / 0 B</span>
            <span id="upload-saved">已保存件数：0 / 0</span>
          </div>
          <progress id="upload-total" max="1" value="0" aria-label="服务端已确认的上传字节"></progress>
          <button id="cancel-queued" class="danger" type="button" disabled>取消全部未开始</button>
        </div>
        <div id="uploads" class="files upload-list"></div>
      </div>
    </section>

    <section id="text-transfer" class="panel-card" hidden aria-labelledby="text-title">
      <div class="section-title">
        <h2 id="text-title">文本互传</h2>
        <span class="section-sub">只保留本次会话，结束自动清空</span>
      </div>
      <div class="text-body">
        <label for="text-draft">发送纯文本给对方</label>
        <textarea id="text-draft" rows="3" autocomplete="off" spellcheck="false" placeholder="输入或手动粘贴文本"></textarea>
        <div class="text-actions">
          <span id="text-size" class="section-sub">0 / 4096 UTF-8 字节</span>
          <button id="text-send" class="primary" type="button">发送文本</button>
        </div>
        <p id="text-status" role="status" aria-live="polite"></p>
        <h3>对方发布的文本</h3>
        <div id="text-received" class="text-list"><p class="text-empty">等待对方发布文本</p></div>
        <h3>我已发送给对方</h3>
        <div id="text-sent" class="text-list"><p class="text-empty">尚未发送文本</p></div>
        <p class="section-sub">每方向最多 64 条 / 128 KiB；访客之间看不到彼此投递的文本。</p>
      </div>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
