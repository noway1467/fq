<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>飞Q · 共享与远控</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="topbar">
      <div class="brand-wrap">
        <span class="brand-mark" aria-hidden="true">FQ</span>
        <div class="brand-text"><strong class="brand">飞Q</strong><span id="page-title">共享文件</span></div>
      </div>
      <button id="disconnect" class="quiet" hidden>断开连接</button>
    </header>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <section id="login" class="connect-panel">
      <div class="connect-header">
        <span class="connect-badge">局域网加密直连</span>
        <h1 id="login-title">连接共享文件夹</h1>
        <p id="login-desc" class="connect-desc">输入对方设备显示的 6 位数字连接码，或直接恢复已配对连接</p>
      </div>
      <form id="connect-form">
        <label for="code">6 位数字连接码</label>
        <div class="connect-row">
          <input id="code" aria-label="6 位连接码" inputmode="numeric" pattern="[0-9]{6}" placeholder="••••••" autocomplete="off" spellcheck="false" minlength="6" maxlength="6">
          <button id="connect" class="primary" type="submit">连接</button>
        </div>
      </form>
      <div class="connect-divider"><span>或使用已信任设备</span></div>
      <button id="reconnect" type="button">连接上次</button>
      <p class="connect-footnote">仅限当前局域网点对点加密通信，共享目录默认只读访问。</p>
    </section>
    <section id="files" hidden>
      <div class="files-header-card">
        <div class="file-toolbar">
          <nav id="breadcrumbs" aria-label="目录位置"></nav>
          <a id="download-folder" class="btn-download" hidden>下载此目录 ZIP</a>
          <div class="toolbar-controls">
            <div class="search-wrap">
              <label class="sr-only" for="search">搜索当前文件夹</label>
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
              <input id="search" type="search" placeholder="搜索当前文件夹…" autocomplete="off" maxlength="256">
            </div>
            <select id="sort" aria-label="排序依据"><option value="name">名称</option><option value="size">大小</option><option value="mtime">修改时间</option></select>
            <select id="order" aria-label="排序方向"><option value="asc">正序</option><option value="desc">倒序</option></select>
            <button id="refresh" type="button" title="刷新当前目录"><svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg><span>刷新</span></button>
          </div>
        </div>
      </div>
      <div class="files-card">
        <div class="list-heading"><span id="count">正在加载</span><span class="readonly-pill">只读共享 · 双击目录进入</span></div>
        <div id="file-list"></div>
        <div id="list-footer" hidden>
          <p id="list-warning" role="status" hidden></p>
          <button id="load-more" type="button" hidden>加载更多</button>
        </div>
      </div>
    </section>
    <section id="remote" hidden>
      <div id="screen-wrap" tabindex="0" aria-label="远程画面"><div id="screen-stage"><canvas id="screen" width="0" height="0" aria-label="远程屏幕"></canvas></div></div>
      <aside id="control-panel">
        <p id="remote-error" role="alert" hidden></p>
        <div class="remote-toolbar">
          <button id="remote-disconnect">断开</button><button id="layout" aria-pressed="false">上下布局</button><button id="rotate" class="native-only">竖屏</button><button id="fullscreen">全屏</button>
          <button id="keyboard" aria-pressed="false">键盘</button><button id="panels">专注</button><button id="zoom">放大</button><button id="fit-screen" title="默认完整显示远程桌面；可切换满高并左右拖动画面">满高</button>
          <select id="display" aria-label="显示器" hidden></select>
        </div>
        <div class="remote-controls">
        <section id="phone-controls" hidden>
          <div class="phone-buttons"><button data-phone-key="back">返回</button><button data-phone-key="home">主页</button><button data-phone-key="recents">最近任务</button></div>
        </section>
        <section class="pointer-controls" aria-label="鼠标操作">
          <div class="pointer-pads">
            <div id="touchpad" role="application" aria-label="触控板：单指移动，轻点左键，双指上下滚动" tabindex="0"></div>
            <div id="wheel-pad" role="application" aria-label="滚轮：单指上下滑动，或按上下方向键滚动远程窗口" tabindex="0"><span aria-hidden="true">↑</span><span>滚轮</span><span aria-hidden="true">↓</span></div>
          </div>
          <div class="mouse-buttons"><button data-input="click">左键</button><button id="double-click">双击</button><button data-input="right">右键</button><button id="drag" aria-pressed="false">拖拽</button></div>
        </section>
        <section class="typing-controls" aria-label="键盘操作">
          <textarea id="remote-text" aria-label="输入到电脑" rows="3" maxlength="4000"></textarea>
          <div class="type-buttons"><button id="type-text" class="primary">输入文字</button><button data-key="enter">Enter</button><button data-key="newline">换行</button><button id="phone-enter" hidden>确认</button></div>
          <div class="clipboard-buttons"><button id="clipboard-send" hidden>发到剪贴板</button><button id="clipboard-read" hidden>读取剪贴板</button></div>
        </section>
        </div>
      <div class="desktop-keys">
      <div class="shortcuts" aria-label="常用快捷键">
        <button data-key="escape">Esc</button><button data-key="tab">Tab</button><button data-key="backspace">退格</button><button data-key="selectall">全选</button><button data-key="copy">复制</button><button data-key="paste">粘贴</button><button data-key="undo">撤销</button><button data-key="find">查找</button><button data-key="switch">切换窗口</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="left">←</button><button data-key="right">→</button><button data-key="pageup">上一页</button><button data-key="pagedown">下一页</button><button data-key="ctrlenter">Ctrl+Enter</button>
        <button data-chord="win" hidden>Win</button><button data-chord="alt+f4" hidden>Alt+F4</button><button data-chord="win+d" hidden>Win+D</button><button data-chord="ctrl+shift+escape" hidden>Ctrl+Shift+Esc</button><button data-chord="delete" hidden>Del</button>
      </div>
      <div id="chord-controls" hidden>
        <div class="modifiers" aria-label="单次组合修饰键"><button data-modifier="ctrl" aria-pressed="false">Ctrl</button><button data-modifier="alt" aria-pressed="false">Alt</button><button data-modifier="shift" aria-pressed="false">Shift</button><button data-modifier="win" aria-pressed="false">Win</button></div>
        <div class="chord-entry"><input id="chord-key" aria-label="组合主键，例如 A、1、F5" placeholder="主键：A / 1 / F5" maxlength="9" autocomplete="off"><button id="chord-send">发送按键</button></div>
      </div>
      </div>
      </aside>
      <button id="restore-panel" hidden>操作</button>
    </section>
  </main>
</body>
</html>
